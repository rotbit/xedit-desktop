<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>无法连接</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fbfbfa;
    color: #37352f;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .box { text-align: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; color: #9b9a97; margin: 0 0 24px; }
  button {
    font-size: 13px;
    padding: 6px 18px;
    border: 1px solid #e3e2e0;
    border-radius: 6px;
    background: #fff;
    color: #37352f;
    cursor: pointer;
  }
  button:hover { background: #f1f0ef; }
</style>
</head>
<body>
  <div class="box">
    <h1>无法连接到 xEdit</h1>
    <p>请检查网络后重试</p>
    <button id="retry">重新连接</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      const back = new URLSearchParams(location.search).get('back')
      location.href = back || 'https://xedit.me/'
    })
  </script>
</body>
</html>
